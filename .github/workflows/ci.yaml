name: CI

# Trigger CI on every push, to any branch.
on:
    # Trigger CI on `git push` to any branch.
    push:
    # Trigger CI via manual button press.
    workflow_dispatch:

# Configure jobs for continuous integration.
jobs:
    # Lint, type-check, and build the project.
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 25
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            - run: npm run build
